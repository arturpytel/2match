<html lang="pl">

<style>
/* Layout: biała aplikacja w jednej kolumnie (560px), panele szerzej (1000px). Bordowe akcenty, w tle miękkie bordowe poblaski i cienkie smugi światła. */
:root{
  --bg:#FFFFFF; --soft:#F8F3F5; --line:#EADFE3; --ink:#17121A; --muted:#6F666C;
  --accent:#7A1530; --accent-hover:#62101F; --accent-soft:#F4E6EA; --wave:122,21,48; --ok:#16794C; --ok-soft:#E7F4EC; --warn:#9C5800; --warn-soft:#FBF1E2;
  --font:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#waves{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,main,footer{position:relative;z-index:1}
a{color:inherit}
h1,h2,h3{font-weight:800;line-height:1.12;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,7vw,3.6rem)}
h2{font-size:1.7rem}
h3{font-size:1.12rem;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{color:var(--accent);font-weight:800;font-size:1.4rem;letter-spacing:-.04em;text-decoration:none}
.top-right{display:flex;gap:16px;align-items:center;font-weight:600;font-size:.95rem}
.top-right a{text-decoration:none}

main{padding-block:12px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.wide{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.box{background:var(--soft);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
hr{border:0;border-top:1px solid var(--line);margin:0}

.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;font:700 1rem/1 var(--font);padding:15px 22px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.line{background:var(--bg);color:var(--accent);border-color:var(--line)}
.btn.line:hover{border-color:var(--accent);background:var(--bg)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:10px 16px;font-size:.9rem}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.quiet{color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

label.f{display:flex;flex-direction:column;gap:7px;font-weight:700;font-size:.92rem}
input[type=text],input[type=email],input[type=date],input[type=number],select,textarea{width:100%;font:500 1rem var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:50px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:96px;resize:vertical}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.95rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.hint{font-size:.86rem;color:var(--muted)}
.err{font-size:.9rem;color:var(--accent);font-weight:600;min-height:1px}
.q{font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 .92rem var(--font);padding:9px 14px;border-radius:999px;cursor:pointer;min-height:42px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag{display:inline-flex;font-size:.88rem;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .chip{padding:9px 0}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:.84rem;color:var(--muted)}

.progress{height:3px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.back{appearance:none;border:0;background:none;font:600 .95rem var(--font);color:var(--muted);cursor:pointer;padding:6px 0}

.slots{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:6px;align-items:center}
.slots .h{font-size:.8rem;font-weight:700;color:var(--muted);text-align:center}
.slots .t{font-size:.8rem;font-weight:600;color:var(--muted);padding-right:4px;white-space:nowrap}
.slot{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;height:42px;cursor:pointer}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}

/* Strona główna */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-block:36px 12px}
.hero > *{min-width:0}
@media (max-width:780px){.hero{grid-template-columns:1fr;gap:32px;padding-block:16px 0}}
.lead{font-size:1.15rem;color:var(--muted);max-width:46ch}
.notif{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 22px 48px -20px rgba(122,21,48,.35);display:flex;flex-direction:column;gap:14px;max-width:380px;justify-self:end;width:100%}
@media (max-width:780px){.notif{justify-self:start}}
.notif-top{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);font-weight:600}
.hero-visual{position:relative;justify-self:end;width:100%;max-width:440px}
.hero-photo{display:block;width:100%;max-width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:24px}
.hero-visual .notif{position:absolute;left:-32px;bottom:-26px;width:86%;max-width:320px}
@media (max-width:780px){.hero-visual{justify-self:stretch;max-width:none}.hero-photo{aspect-ratio:4/3}.hero-visual .notif{position:relative;left:auto;bottom:auto;margin:-56px 12px 0;width:auto;max-width:none}}
.venue-photo{display:block;width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media (max-width:780px){.how{grid-template-columns:1fr;gap:18px}}
.how div{display:flex;flex-direction:column;gap:6px}
.how b{font-size:1.05rem}

/* Dopasowanie i randka */
.person{display:flex;gap:16px;align-items:center}
.person > div:last-child{min-width:0}
.avatar{width:72px;height:72px;border-radius:50%;overflow:hidden;flex:none;background:var(--accent-soft);display:grid;place-items:center;font-weight:800;font-size:1.6rem;color:var(--accent)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.hidden{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 8px,#EBD3DA 8px 16px);color:transparent}
.score{font-size:3rem;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;font-size:.9rem}
.bar{height:6px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.details{display:grid;grid-template-columns:auto 1fr;gap:12px 20px;margin:0}
.details dt{color:var(--muted);font-weight:600}
.details dd{margin:0;font-weight:700;min-width:0}
.codebox{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:16px 18px}
.code{font-size:1.6rem;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.note{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:.95rem}
.note.ok{background:var(--ok-soft)}
.note.warn{background:var(--warn-soft)}
.status{font-size:.86rem;font-weight:700;color:var(--muted)}
.status.ok{color:var(--ok)}

/* Panele */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:.8rem;font-weight:600;color:var(--muted)}
.kpi b{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two > *{min-width:0}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.8rem;font-weight:700;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.ratio{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft)}
.ratio i{display:block;height:100%}
.hist{display:flex;align-items:flex-end;gap:6px;height:120px;border-bottom:1px solid var(--line)}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.hist i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.hist small,.hist-x span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hist-x{display:flex;gap:6px}
.hist-x span{flex:1;text-align:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.progress i{transition:none}}
footer{border-top:1px solid var(--line);background:rgba(255,255,255,.85)}
.foot{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:space-between;align-items:center;padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:.86rem;color:var(--muted)}
.foot nav{display:flex;gap:18px;flex-wrap:wrap}
.foot a,.foot button{color:var(--muted);text-decoration:none;font:600 .86rem var(--font);background:none;border:0;padding:0;cursor:pointer}
.foot a:hover,.foot button:hover{color:var(--ink)}
</style>
</head>
<body>
<canvas id="waves" aria-hidden="true"></canvas>
<header class="top"><div class="top-in"><a class="logo" id="logo" href="#start">2match</a><div class="top-right" id="topright"></div></div></header>
<main id="app"></main>
<footer><div class="foot"><span>2match · Kraków · wersja pilotażowa</span><nav aria-label="Pozostałe"><a href="#lokal">Dla lokali</a><a href="#admin">Panel zespołu</a><button type="button" data-act="demo">Demo</button></nav></div></footer>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/*ALGO-START*/
const APP_NAME = '2match';
const DAYS = ['Pn','Wt','Śr','Cz','Pt','Sb','Nd'];
const TIMES = [{l:'12–15',start:13},{l:'15–18',start:16},{l:'18–21',start:19}];
const CATALOG = {
  'Sport':['Bieganie','Wspinaczka','Siłownia','Rower','Pływanie','Narty i snowboard','Siatkówka','Joga'],
  'Muzyka':['Koncerty','Techno','Jazz','Indie','Hip-hop','Gram na instrumencie'],
  'Film i seriale':['Kino studyjne','Seriale kryminalne','Anime','Horrory'],
  'Gry':['Planszówki','Gry komputerowe','Szachy'],
  'Sztuka':['Fotografia','Muzea i galerie','Teatr','Rysunek'],
  'Podróże':['City breaki','Tatry','Backpacking'],
  'Nauka':['Psychologia','Astronomia','Startupy i tech','Historia'],
  'Jedzenie':['Gotowanie','Kawa specialty','Wino','Street food'],
  'Wyjścia':['Stand-up','Kluby','Festiwale','Pub quizy'],
  'Inne':['Wolontariat','Książki','Języki obce','Zwierzęta']
};
const ALL_INTERESTS = Object.values(CATALOG).flat();
const VALUES = [
  {q:'Idealny weekend', lo:'spokojnie w domu', hi:'na mieście do rana'},
  {q:'Energia', lo:'ładuję baterie w ciszy', hi:'ładuję baterie z ludźmi'},
  {q:'Przyszłość', lo:'żyję chwilą', hi:'mam plan na 5 lat'},
  {q:'Czego szukam', lo:'zobaczmy, co wyjdzie', hi:'poważnego związku'},
  {q:'Tryb życia', lo:'kanapa i koc', hi:'ciągle w ruchu'}
];
const SPECIAL = {
  poglady:{q:'Światopogląd', opts:['lewicowy','centrowy','prawicowy']},
  religia:{q:'Religia w moim życiu', opts:['nieważna','umiarkowanie ważna','bardzo ważna']}
};
const CUISINES = ['włoska','japońska','wietnamska','meksykańska','indyjska','gruzińska','polska','bliskowschodnia','koreańska','wegańska','francuska'];
const BUDGETS = [{id:'kawa',l:'Kawa',d:'do 30 zł'},{id:'deser',l:'Kawa i deser',d:'do 50 zł'},{id:'kolacja',l:'Kolacja',d:'do 120 zł'}];
const LEVEL = {kawa:0,deser:1,kolacja:2};
const cuisineAcc = c => c.slice(0,-1)+'ą';
const cuisineGen = c => c==='bliskowschodnia' ? 'bliskowschodniej' : c.slice(0,-1)+'iej';

const VENUES = [
  {id:'v1',name:'Dwa Krzesła',kind:'kawiarnia',addr:'ul. Józefa 14, Kazimierz',cuisines:['francuska'],types:['kawa','deser'],veg:true,days:[0,1,2,3,4,5,6],times:[0,1,2],cap:3,offer:'Drugi deser gratis'},
  {id:'v2',name:'Nonna Wanda',kind:'trattoria',addr:'ul. Krakowska 31, Kazimierz',cuisines:['włoska'],types:['deser','kolacja'],veg:true,days:[1,2,3,4,5,6],times:[1,2],cap:2,offer:'−15% na cały rachunek'},
  {id:'v3',name:'Phở Ngõ',kind:'bistro',addr:'ul. Limanowskiego 9, Podgórze',cuisines:['wietnamska','koreańska'],types:['kolacja','deser'],veg:true,days:[0,1,2,3,4,5,6],times:[0,1,2],cap:2,offer:'Herbata jaśminowa dla dwojga gratis'},
  {id:'v4',name:'Chinkali Tbilisi',kind:'restauracja',addr:'ul. Starowiślna 52, Kazimierz',cuisines:['gruzińska','bliskowschodnia'],types:['kolacja'],veg:false,days:[2,3,4,5,6],times:[2],cap:2,offer:'Chaczapuri na start za pół ceny'},
  {id:'v5',name:'Matcha i Mochi',kind:'herbaciarnia',addr:'ul. Bracka 6, Stare Miasto',cuisines:['japońska'],types:['kawa','deser'],veg:true,days:[0,1,2,3,4,5,6],times:[0,1,2],cap:3,offer:'−20% na matchę'},
  {id:'v6',name:'Ziemia Obiecana',kind:'bistro',addr:'ul. Dajwór 3, Kazimierz',cuisines:['polska','wegańska'],types:['deser','kolacja'],veg:true,days:[0,1,2,3,4,5,6],times:[1,2],cap:2,offer:'Lemoniada domowa gratis'},
  {id:'v7',name:'Taquería Lucha',kind:'taquería',addr:'ul. Miodowa 20, Kazimierz',cuisines:['meksykańska'],types:['kolacja'],veg:true,days:[1,2,3,4,5,6],times:[2],cap:2,offer:'Nachos dla dwojga gratis'},
  {id:'v8',name:'Masala Lane',kind:'restauracja',addr:'ul. Dietla 41, Stradom',cuisines:['indyjska','bliskowschodnia'],types:['kolacja','deser'],veg:true,days:[0,1,2,3,4,5,6],times:[1,2],cap:2,offer:'Lassi mango gratis'}
];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function hashUnit(s){return mulberry32(hashStr(s))()}

function makeSeeds(){
  const r = mulberry32(20261030);
  const pick = a => a[Math.floor(r()*a.length)];
  const sample = (a,n) => {const c=[...a],o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(r()*c.length),1)[0]);return o};
  const F=['Kasia','Zuzia','Natalia','Maja','Julia','Wiktoria','Hania','Ania','Magda','Karolina','Martyna','Ola','Weronika','Ela','Iga','Lena','Paulina','Amelia','Marta','Nina'];
  const M=['Kuba','Michał','Bartek','Kacper','Szymon','Filip','Antek','Mateusz','Piotrek','Wojtek','Igor','Tymek','Staszek','Kamil','Adam','Janek','Olek','Dawid','Maciek','Hubert'];
  const N=['Alex','Sasza','Robin','Nikola'];
  const UNIS=['UJ','AGH','UEK','PK','UP','ASP'];
  const cats = Object.keys(CATALOG);
  const out=[];
  for(let i=0;i<60;i++){
    const g = r(); const gender = g<0.46?'K':g<0.96?'M':'N';
    const name = gender==='K'?pick(F):gender==='M'?pick(M):pick(N);
    const age = 19+Math.floor(r()*8);
    let seeking;
    const s=r();
    if(gender==='K') seeking = s<0.85?['M']:s<0.95?['K']:['K','M'];
    else if(gender==='M') seeking = s<0.9?['K']:['M'];
    else seeking=['K','M','N'];
    if(gender!=='N' && r()<0.2) seeking=[...seeking,'N'];
    const persona = sample(cats,2);
    let interests = [...sample(CATALOG[persona[0]],3),...sample(CATALOG[persona[1]],3)];
    const extra = sample(ALL_INTERESTS.filter(x=>!interests.includes(x)),1+Math.floor(r()*4));
    interests = [...new Set([...interests,...extra])];
    const top = [interests[0],interests[3],interests[1]].filter(Boolean).slice(0,3);
    const values = VALUES.map(()=>1+Math.floor(r()*5));
    const like = sample(CUISINES,3);
    const tryC = sample(CUISINES.filter(c=>!like.includes(c)),2);
    const b=r(); const budget = b<0.35?'kawa':b<0.65?'deser':'kolacja';
    const allSlots=[]; for(let d=0;d<7;d++)for(let t=0;t<3;t++)allSlots.push(d+'-'+t);
    const evening = allSlots.filter(x=>x.endsWith('-2')||x.endsWith('-1'));
    const slots = [...new Set([...sample(evening,4+Math.floor(r()*4)),...sample(allSlots,1+Math.floor(r()*2))])];
    const special = r()<0.6 ? {poglady:pick(SPECIAL.poglady.opts),religia:pick(SPECIAL.religia.opts)} : {};
    out.push({id:'u'+(i+1),name,gender,age,seeking,ageMin:Math.max(18,age-2-Math.floor(r()*3)),ageMax:age+2+Math.floor(r()*4),
      uni:pick(UNIS),city:'Kraków',interests,top,values,special,like,tryC,budget,veg:r()<0.15,slots,
      verified:r()<0.92,active:true,paused:false,insta:name.toLowerCase().replace(/[^a-z]/g,'')+'.'+(100+Math.floor(r()*900)),shift:{}});
  }
  /* 60 kont 28–45 lat: osoby pracujące, które też szukają stałego związku */
  const F2=['Agnieszka','Monika','Joanna','Ewa','Katarzyna','Dorota','Anna','Beata','Sylwia','Justyna'];
  const M2=['Tomasz','Paweł','Marcin','Łukasz','Krzysztof','Grzegorz','Rafał','Marek','Andrzej','Sebastian'];
  const JOBS=['Branża IT','Marketing','Finanse','Architektura','Medycyna','Prawo','Edukacja','Własna firma','Gastronomia','HR'];
  for(let i=60;i<120;i++){
    const gender=r()<0.5?'K':'M', name=gender==='K'?pick(F2):pick(M2), age=28+Math.floor(r()*18);
    const seeking=gender==='K'?(r()<0.92?['M']:['K']):(r()<0.92?['K']:['M']);
    const persona=sample(cats,2);
    let interests=[...sample(CATALOG[persona[0]],3),...sample(CATALOG[persona[1]],3)];
    interests=[...new Set([...interests,...sample(ALL_INTERESTS.filter(x=>!interests.includes(x)),1+Math.floor(r()*3))])];
    const top=[interests[0],interests[3],interests[1]].filter(Boolean).slice(0,3);
    const values=VALUES.map(()=>1+Math.floor(r()*5));
    const like=sample(CUISINES,3), tryC=sample(CUISINES.filter(c=>!like.includes(c)),2);
    const b=r(), budget=b<0.2?'kawa':b<0.45?'deser':'kolacja';
    const allSlots=[]; for(let d=0;d<7;d++)for(let t=0;t<3;t++)allSlots.push(d+'-'+t);
    const slots=[...new Set([...sample(allSlots.filter(x=>x.endsWith('-2')),3+Math.floor(r()*3)),...sample(allSlots.filter(x=>x.startsWith('5-')||x.startsWith('6-')),2)])];
    out.push({id:'u'+(i+1),name,gender,age,seeking,ageMin:Math.max(25,age-6),ageMax:age+5,
      uni:pick(JOBS),city:'Kraków',interests,top,values,special:{},like,tryC,budget,veg:r()<0.15,slots,
      verified:r()<0.95,active:true,paused:false,insta:name.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'')+'.'+(100+Math.floor(r()*900)),shift:{}});
  }
  return out;
}

const pairKey = (a,b) => [a.id,b.id].sort().join('|');
const commonSlots = (a,b) => a.slots.filter(s=>b.slots.includes(s));
const dateType = (a,b) => ['kawa','deser','kolacja'][Math.min(LEVEL[a.budget],LEVEL[b.budget])];
const genderOk = (a,b) => a.seeking.includes(b.gender) && b.seeking.includes(a.gender);
const ageOk = (a,b) => b.age>=a.ageMin && b.age<=a.ageMax && a.age>=b.ageMin && a.age<=b.ageMax;

function nextOccurrence(slot, from){
  const [d,t] = slot.split('-').map(Number);
  const jsDay = (d+1)%7;
  for(let k=0;k<15;k++){
    const dt = new Date(from); dt.setHours(0,0,0,0); dt.setDate(dt.getDate()+k);
    if(dt.getDay()!==jsDay) continue;
    dt.setHours(TIMES[t].start,0,0,0);
    if(dt.getTime()-from >= 24*3600e3) return dt;
  }
  return null;
}

function venueScore(v,a,b){
  let s=0;
  for(const c of v.cuisines){
    const al=a.like.includes(c), at=a.tryC.includes(c), bl=b.like.includes(c), bt=b.tryC.includes(c);
    if(al&&bl) s+=3; else if((al&&bt)||(at&&bl)||(at&&bt)) s+=2; else if(al||at||bl||bt) s+=1;
  }
  return s;
}

function pickReservation(a,b,from,load,excludeSlot){
  const type = dateType(a,b); const veg = a.veg||b.veg;
  const opts = commonSlots(a,b).filter(s=>s!==excludeSlot)
    .map(s=>({s,date:nextOccurrence(s,from)})).filter(x=>x.date).sort((x,y)=>x.date-y.date);
  for(const {s,date} of opts){
    const [d,t]=s.split('-').map(Number);
    const cands = VENUES.filter(v=>v.types.includes(type)&&(!veg||v.veg)&&v.days.includes(d)&&v.times.includes(t)
      &&((load[v.id+'|'+date.toISOString()]||0)<v.cap))
      .map(v=>({v,sc:venueScore(v,a,b)})).sort((x,y)=>y.sc-x.sc);
    if(cands.length) return {venueId:cands[0].v.id,slot:s,date:date.toISOString(),type};
  }
  return null;
}

function interestSim(a,b){
  const w = (u,x) => u.interests.includes(x) ? (u.top.includes(x)?2:1) : 0;
  const all = new Set([...a.interests,...b.interests]);
  let mn=0,mx=0; for(const x of all){mn+=Math.min(w(a,x),w(b,x));mx+=Math.max(w(a,x),w(b,x))}
  // Ważony Jaccard przy ~10 wyborach z 40 rzadko przekracza 0,5, więc skalujemy ×2 (z limitem 1).
  return mx ? Math.min(1,(mn/mx)*2) : 0;
}
function valueSim(a,b){
  let diffs = a.values.map((v,i)=>Math.abs(v-b.values[i])/4);
  for(const k of Object.keys(SPECIAL)){
    const av=a.special&&a.special[k], bv=b.special&&b.special[k];
    if(av&&bv){const o=SPECIAL[k].opts; diffs.push(Math.abs(o.indexOf(av)-o.indexOf(bv))/2)}
  }
  return 1 - diffs.reduce((s,x)=>s+x,0)/diffs.length;
}
function cuisineSim(a,b){
  const A=new Set([...a.like,...a.tryC]), B=new Set([...b.like,...b.tryC]);
  const inter=[...A].filter(x=>B.has(x)).length, uni=new Set([...A,...B]).size;
  const bd=[1,0.6,0.3][Math.abs(LEVEL[a.budget]-LEVEL[b.budget])];
  return 0.75*Math.min(1,(uni?inter/uni:0)*2)+0.25*bd;
}
const availSim = (a,b) => Math.min(1,commonSlots(a,b).length/3);

function scorePair(a,b,cfg){
  const parts={i:interestSim(a,b),v:valueSim(a,b),c:cuisineSim(a,b),a:availSim(a,b)};
  const w={};
  for(const k of ['i','v','c','a']){
    const sh=((a.shift&&a.shift[k])||0)+((b.shift&&b.shift[k])||0);
    w[k]=Math.max(0,cfg.weights[k]+sh/2);
  }
  const sw=w.i+w.v+w.c+w.a||1;
  const total=100*(w.i*parts.i+w.v*parts.v+w.c*parts.c+w.a*parts.a)/sw;
  return {total,parts};
}

function hardOk(a,b,ctx){
  if(!(a.verified&&b.verified&&a.active&&b.active&&!a.paused&&!b.paused)) return false;
  if(!genderOk(a,b)||!ageOk(a,b)||a.city!==b.city) return false;
  if(ctx.prior.includes(pairKey(a,b))) return false;
  if(ctx.blocked.includes(a.id)||ctx.blocked.includes(b.id)) {
    if((a.id==='me'&&ctx.blocked.includes(b.id))||(b.id==='me'&&ctx.blocked.includes(a.id))) return false;
  }
  if(!commonSlots(a,b).length) return false;
  return !!pickReservation(a,b,ctx.now,{});
}

/* Tygodniowy drop: graf kandydatów → zachłanne skojarzenie po wadze → poprawki zamianą par (2-opt). */
function runDrop(users,cfg,ctx){
  const elig = users.filter(u=>u.verified&&u.active&&!u.paused);
  const edges=[], W={};
  for(let i=0;i<elig.length;i++)for(let j=i+1;j<elig.length;j++){
    const a=elig[i],b=elig[j];
    if(!hardOk(a,b,ctx)) continue;
    const s=scorePair(a,b,cfg);
    if(s.total<cfg.threshold) continue;
    const boost=(ctx.waiting.includes(a.id)?5:0)+(ctx.waiting.includes(b.id)?5:0);
    const e={a,b,s,w:s.total+boost}; edges.push(e); W[pairKey(a,b)]=e;
  }
  edges.sort((x,y)=>y.w-x.w);
  const used=new Set(); let pairs=[];
  for(const e of edges){ if(used.has(e.a.id)||used.has(e.b.id)) continue; used.add(e.a.id);used.add(e.b.id);pairs.push(e) }
  let improved=true, guard=0;
  while(improved && guard++<20){
    improved=false;
    for(let i=0;i<pairs.length;i++)for(let j=i+1;j<pairs.length;j++){
      const p=pairs[i],q=pairs[j]; const cur=p.w+q.w;
      for(const [x,y,z,t] of [[p.a,q.a,p.b,q.b],[p.a,q.b,p.b,q.a]]){
        const e1=W[pairKey(x,y)], e2=W[pairKey(z,t)];
        if(e1&&e2&&e1.w+e2.w>cur+1e-9){pairs[i]=e1;pairs[j]=e2;improved=true;break}
      }
    }
  }
  const matched=new Set(pairs.flatMap(p=>[p.a.id,p.b.id]));
  const unmatched=elig.filter(u=>!matched.has(u.id));
  const avg=pairs.length?pairs.reduce((s,p)=>s+p.s.total,0)/pairs.length:0;
  return {pairs,unmatched,edges:edges.length,stats:{registered:users.length,verified:users.filter(u=>u.verified).length,eligible:elig.length,pairs:pairs.length,avg}};
}

function reasonsFor(me,p){
  const out=[];
  const topBoth=me.top.filter(x=>p.top.includes(x));
  const common=me.interests.filter(x=>p.interests.includes(x));
  if(topBoth.length) out.push('Oboje macie „'+topBoth[0]+'” wśród rzeczy, które są dla Was najważniejsze.');
  else if(common.length) out.push('Łączy Was: '+common.slice(0,3).join(', ').toLowerCase()+'.');
  let best=-1,bi=-1;
  me.values.forEach((v,i)=>{const d=Math.abs(v-p.values[i]);const ext=Math.abs((v+p.values[i])/2-3);if(d<=1&&ext>best){best=ext;bi=i}});
  if(bi>=0){const avg=(me.values[bi]+p.values[bi])/2;const lab=avg>3?VALUES[bi].hi:avg<3?VALUES[bi].lo:'gdzieś pośrodku';out.push('„'+VALUES[bi].q+'”: oboje jesteście bliżej opcji „'+lab+'”.')}
  const tryBoth=me.tryC.filter(c=>p.tryC.includes(c)||p.like.includes(c));
  const likeBoth=me.like.filter(c=>p.like.includes(c));
  if(likeBoth.length) out.push('Oboje lubicie kuchnię '+cuisineAcc(likeBoth[0])+'.');
  else if(tryBoth.length) out.push('Chcesz spróbować kuchni '+cuisineGen(tryBoth[0])+', a '+p.name+' też ją lubi.');
  return out.slice(0,3);
}

function makeCode(seed){
  const A='ACDEFHJKMNPQRTUVWXY3479'; const r=mulberry32(hashStr(seed)); let c='';
  for(let i=0;i<4;i++) c+=A[Math.floor(r()*A.length)];
  return '2M-'+c;
}

function defaultDraft(){return {email:'',otpSent:'',otp:'',consent:{reg:false,art9:false},name:'',birth:'',gender:'',seeking:[],ageMin:19,ageMax:27,uni:'',interests:[],top:[],values:[3,3,3,3,3],special:{},like:[],tryC:[],budget:'deser',veg:false,slots:[],photo:null,selfie:false,leg:false}}
function freshState(cfg){return {v:2,me:null,onb:{step:0,draft:defaultDraft(),editing:false},config:cfg||JSON.parse(JSON.stringify(DEFAULT_CONFIG)),prior:[],blocked:[],waiting:[],match:null,lastDrop:null,meUnmatched:false,history:[],ledger:[],checked:{},waitlist:false,lastOutcome:null,dropCount:0}}
let S=store.get('2match-v3',null)||freshState();
const save=()=>store.set('2match-v3',S);
const usersNow=()=>S.me?[...SEEDS,S.me]:[...SEEDS];
const byId=id=>id==='me'?S.me:SEEDS.find(u=>u.id===id);
const venue=id=>VENUES.find(v=>v.id===id);

function doDrop(){
  const now=Date.now(), me=S.me;
  const taken=S.match?S.match.partnerId:null; /* osoba z aktywną propozycją nie bierze udziału w losowaniu */
  const pool=SEEDS.filter(u=>u.id!==taken).concat(me&&!S.match&&!S.waitlist?[me]:[]);
  const res=runDrop(pool,S.config,{prior:S.prior,blocked:S.blocked,waiting:S.waiting,now});
  const load={},reservations=[],sim={accepted:0,held:0,noshow:0,ratings:[]};
  for(const p of res.pairs){
    if(p.a.id==='me'||p.b.id==='me') continue;
    const k=pairKey(p.a,p.b),u=hashUnit(k+'#'+S.dropCount),u2=hashUnit(k+'@');
    if(u<Math.min(0.92,Math.max(0.25,(p.s.total-35)/50))){
      sim.accepted++;
      const r=pickReservation(p.a,p.b,now,load);
      if(r){load[r.venueId+'|'+r.date]=(load[r.venueId+'|'+r.date]||0)+1;reservations.push({...r,code:makeCode(k+S.dropCount),names:p.a.name+' i '+p.b.name,ids:[p.a.id,p.b.id]})}
      if(u2<0.86){sim.held++;sim.ratings.push(Math.max(2,Math.min(5,Math.round(3+(p.s.total-55)/18+(u2-0.4)))))}else sim.noshow++;
    }
  }
  S.dropCount++;
  S.lastDrop={at:now,stats:res.stats,edges:res.edges,sim,load,reservations,
    pairs:res.pairs.map(p=>({a:p.a.id,b:p.b.id,score:Math.round(p.s.total),parts:p.s.parts})),unmatched:res.unmatched.map(u=>u.id)};
  S.waiting=res.unmatched.map(u=>u.id);
  S.meUnmatched=false;
  if(me&&pool.includes(me)){
    const mine=res.pairs.find(p=>p.a.id==='me'||p.b.id==='me');
    if(mine){const partner=mine.a.id==='me'?mine.b:mine.a;
      S.match={partnerId:partner.id,score:Math.round(mine.s.total),parts:mine.s.parts,reasons:reasonsFor(me,partner),created:now,expires:now+24*3600e3,my:null,partner:null,paid:false,res:null,changed:false,checkin:false,first:!S.history.length};
    } else S.meUnmatched=true;
  }
  save();
}
if(!S.lastDrop) doDrop();

function ageFrom(b){if(!b)return 0;const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2800)}
function nextDropAt(){const c=S.config,n=new Date(),jsDay=(c.dropDay+1)%7;for(let k=0;k<8;k++){const d=new Date(n);d.setHours(c.dropHour,0,0,0);d.setDate(d.getDate()+k);if(d.getDay()===jsDay&&d>n)return d}return new Date(n.getTime()+7*864e5)}
function untilText(target){const ms=target-Date.now();if(ms<=0)return 'za chwilę';const h=Math.floor(ms/3600e3),m=Math.floor(ms%3600e3/60e3);if(h>=48)return 'za '+Math.floor(h/24)+' dni';if(h>=1)return 'za '+h+' godz. '+m+' min';return 'za '+m+' min'}
const verb=(u,m,f,n)=>u.gender==='K'?f:u.gender==='N'?n:m;
function avatar(u,hidden){
  if(hidden) return '<div class="avatar hidden" role="img" aria-label="Zdjęcie odsłoni się po obustronnej zgodzie">'+esc(u.name[0])+'</div>';
  const src=u.photo||PHOTOS[u.id];
  if(src) return '<div class="avatar"><img src="'+src+'" alt="'+esc(u.name)+'"></div>';
  return '<div class="avatar" aria-hidden="true">'+esc(u.name[0])+'</div>';
}

/* ----- Rejestracja ----- */
function chip(on,label,act,val){return '<button type="button" class="chip" aria-pressed="'+on+'" data-act="'+act+'" data-v="'+esc(val)+'">'+esc(label)+'</button>'}
function stepBody(i,d){
  if(i===0) return '<label class="f" for="f-name">Imię<input id="f-name" type="text" autocomplete="given-name" value="'+esc(d.name)+'" data-bind="name"></label>'+
    '<label class="f" for="f-birth">Data urodzenia<input id="f-birth" type="date" value="'+esc(d.birth)+'" data-bind="birth"></label>'+
    '<div class="stack"><span class="q">Jestem</span><div class="chips">'+['K','M','N'].map(g=>chip(d.gender===g,genderLabel[g],'gender',g)).join('')+'</div></div>'+
    '<div class="stack"><span class="q">Chcę poznać</span><div class="chips">'+['K','M','N'].map(g=>chip(d.seeking.includes(g),seekLabel[g],'seek',g)).join('')+'</div></div>'+
    '<div class="row" style="flex-wrap:nowrap"><label class="f" style="flex:1" for="f-amin">W wieku od<input id="f-amin" type="number" min="18" max="80" value="'+d.ageMin+'" data-bind="ageMin" data-num="1"></label>'+
    '<label class="f" style="flex:1" for="f-amax">do<input id="f-amax" type="number" min="18" max="80" value="'+d.ageMax+'" data-bind="ageMax" data-num="1"></label></div>'+
    '<label class="f" for="f-uni">Czym się zajmujesz? <span class="muted">(opcjonalnie)</span><input id="f-uni" type="text" maxlength="40" placeholder="np. studia na AGH, marketing, własna firma" value="'+esc(d.uni)+'" data-bind="uni"></label>';
  if(i===1){
    let h='<p class="muted">Wybierz od 5 do 15 rzeczy. Na tej podstawie dobieramy ludzi, więc im szczerzej, tym lepiej.</p>';
    for(const [cat,items] of Object.entries(CATALOG)) h+='<div class="stack" style="gap:8px"><span class="q small">'+cat+'</span><div class="chips">'+items.map(x=>chip(d.interests.includes(x),x,'interest',x)).join('')+'</div></div>';
    if(d.interests.length>=3) h+='<hr><div class="stack"><span class="q">Które trzy są dla Ciebie najważniejsze?</span><p class="hint">Te liczą się przy dopasowaniu podwójnie.</p><div class="chips">'+d.interests.map(x=>chip(d.top.includes(x),x,'top',x)).join('')+'</div></div>';
    return h;
  }
  if(i===2){
    let h=VALUES.map((v,k)=>'<div class="stack" style="gap:8px"><span class="q">'+v.q+'</span><div class="scale" role="group" aria-label="'+v.q+'">'+[1,2,3,4,5].map(n=>'<button type="button" class="chip" aria-label="'+n+' z 5" aria-pressed="'+(d.values[k]===n)+'" data-act="val" data-k="'+k+'" data-v="'+n+'">'+n+'</button>').join('')+'</div><div class="ends"><span>'+cap(v.lo)+'</span><span style="text-align:right">'+cap(v.hi)+'</span></div></div>').join('');
    h+='<hr><label class="check" for="c-art9"><input id="c-art9" type="checkbox" data-bind="consent.art9" '+(d.consent.art9?'checked':'')+'><span>Chcę, żeby przy dopasowaniu liczył się też światopogląd i religia. To dane wrażliwe (art. 9 RODO), dlatego pytamy o osobną zgodę.</span></label>';
    if(d.consent.art9) for(const [k,sp] of Object.entries(SPECIAL)) h+='<div class="stack" style="gap:8px"><span class="q">'+sp.q+'</span><div class="chips">'+sp.opts.map(o=>chip(d.special[k]===o,cap(o),'special',k+'|'+o)).join('')+chip(!d.special[k],'Wolę nie mówić','special',k+'|')+'</div></div>';
    return h;
  }
  if(i===3) return '<div class="stack"><span class="q">Lubię kuchnię</span><div class="chips">'+CUISINES.map(c=>chip(d.like.includes(c),cap(c),'like',c)).join('')+'</div></div>'+
    '<div class="stack"><span class="q">Chcę spróbować</span><div class="chips">'+CUISINES.map(c=>chip(d.tryC.includes(c),cap(c),'tryc',c)).join('')+'</div></div>'+
    '<div class="stack"><span class="q">Na pierwszą randkę wolę</span><div class="chips">'+BUDGETS.map(b=>chip(d.budget===b.id,b.l+', '+b.d,'budget',b.id)).join('')+'</div><p class="hint">Jeśli macie różne preferencje, wybieramy tańszą opcję.</p></div>'+

    let h='<p class="muted">Zaznacz, kiedy zwykle masz czas. Termin randki wybierzemy z okien, które macie wspólne.</p><div class="slots"><span></span>'+DAYS.map(x=>'<span class="h">'+x+'</span>').join('');

    return h+'</div>';

    '<label class="btn line sm" for="f-photo">'+(d.photo?'Zmień zdjęcie':'Dodaj zdjęcie')+'</label><input id="f-photo" type="file" accept="image/*" hidden data-file="photo"></div>'+

    '<div class="row"><label class="btn line sm" for="f-selfie">'+(d.selfie?'Selfie dodane ✓':'Dodaj selfie')+'</label><input id="f-selfie" type="file" accept="image/*" hidden data-file="selfie">'+
    '<label class="btn line sm" for="f-doc">'+(d.doc?'Dokument dodany ✓':'Dodaj dokument')+'</label><input id="f-doc" type="file" accept="image/*" hidden data-file="doc"></div>'+
    '<p class="hint">Wersja pilotażowa: możesz to pominąć, w pełnej wersji bez weryfikacji nie ma randki.</p></div>')+
    (S.onb.editing?'':'<p class="hint">Klikając „Zakończ”, akceptujesz regulamin i politykę prywatności 2match.</p>');
}
function stepError(i,d){
  if(i===0){if(d.name.trim().length<2)return 'Jak masz na imię?';if(!d.birth)return 'Podaj datę urodzenia.';if(ageFrom(d.birth)<18)return '2match jest tylko dla osób pełnoletnich.';
    if(!d.gender)return 'Zaznacz, kim jesteś.';if(!d.seeking.length)return 'Zaznacz, kogo chcesz poznać.';if(d.ageMin<18||d.ageMin>d.ageMax)return 'Sprawdź przedział wieku. Najniższy możliwy to 18.';}
  if(i===1){if(d.interests.length<5)return 'Wybierz jeszcze '+(5-d.interests.length)+'.';if(!d.top.length)return 'Wskaż, co jest dla Ciebie najważniejsze.';}
  if(i===3&&!d.like.length)return 'Wybierz przynajmniej jedną kuchnię, którą lubisz.';
  if(i===4&&d.slots.length<2)return 'Zaznacz przynajmniej dwa okna.';
  return '';
}
VIEWS.dolacz=()=>{
  if(S.me&&!S.onb.editing){location.hash=homeHash();return ''}
  const i=S.onb.step,d=S.onb.draft,last=STEPS.length-1;
  const label=i===last?(S.onb.editing?'Zapisz':'Zakończ i znajdź mi kogoś'):'Dalej';
  return '<div class="col fade"><div class="stack" style="gap:14px"><div class="row" style="justify-content:space-between;min-height:34px">'+
    (i>0?'<button type="button" class="back" data-act="back">← Wstecz</button>':'<span></span>')+(S.onb.editing?'<button type="button" class="back" data-act="cancelEdit">Anuluj</button>':'')+'</div>'+
    '<div class="progress"><i style="width:'+((i+1)/(last+1)*100)+'%"></i></div></div>'+
    '<h2>'+STEPS[i]+'</h2><form class="stack" id="onb" novalidate style="gap:22px">'+stepBody(i,d)+'<p class="err" id="onb-err" aria-live="polite"></p>'+
    '<button type="submit" class="btn block">'+label+'</button></form></div>';
};
function finishOnboarding(){
  const d=S.onb.draft,prev=S.me||{};
  S.me={id:'me',name:d.name.trim(),birth:d.birth,age:ageFrom(d.birth),gender:d.gender,seeking:[...d.seeking],ageMin:d.ageMin,ageMax:d.ageMax,uni:(d.uni||'').trim()||'Kraków',city:'Kraków',
    interests:[...d.interests],top:[...d.top],values:[...d.values],special:d.consent.art9?{...d.special}:{},like:[...d.like],tryC:[...d.tryC],budget:d.budget,veg:d.veg,slots:[...d.slots],photo:d.photo,
    verified:true,active:true,paused:prev.paused||false,reliability:prev.reliability??100,noShows:prev.noShows||0,freeDate:prev.freeDate||false,shift:prev.shift||{},consent:{reg:true,art9:!!d.consent.art9}};
  S.waitlist=false;S.onb.editing=false;S.onb.step=0;save();
}
const homeHash=()=>!S.me?'#start':S.match?(S.match.paid?'#randka':'#match'):'#czekam';

/* Dopasowanie na żądanie: najlepsza dostępna osoba po filtrach twardych, bez czekania na losowanie. */
function matchNow(){
  const me=S.me,now=Date.now();
  if(!me||me.paused) return false;
  const ctx={prior:S.prior,blocked:S.blocked,waiting:[],now};
  const booked=new Set(((S.lastDrop&&S.lastDrop.reservations)||[]).flatMap(r=>r.ids||[])); /* nie proponujemy osób, które mają już rezerwację */
  const cands=SEEDS.filter(u=>!booked.has(u.id)&&hardOk(me,u,ctx)).map(u=>({u,s:scorePair(me,u,S.config)})).filter(c=>c.s.total>=S.config.threshold).sort((a,b)=>b.s.total-a.s.total); /* próg jak w cotygodniowym losowaniu */
  if(!cands.length){S.meUnmatched=true;save();return false}
  const best=cands[0];
  S.match={partnerId:best.u.id,score:Math.round(best.s.total),parts:best.s.parts,reasons:reasonsFor(me,best.u),created:now,expires:now+24*3600e3,my:null,partner:null,paid:false,res:null,changed:false,checkin:false,first:!S.history.length};
  S.meUnmatched=false;S.lastOutcome=null;save();return true;
}

  return '<div class="col fade">'+out+um+
    '<div class="stack" style="gap:8px"><p class="muted">Cześć, '+esc(me.name)+'</p><h2>'+(me.paused?'Twoje konto jest wstrzymane':'Gotowy na randkę?')+'</h2>'+
    (me.paused?'<p class="muted">Nie dobieramy Ci teraz nikogo. Możesz wrócić w każdej chwili w ustawieniach konta.</p>':'<p class="muted">Kliknij, a algorytm przejrzy wszystkich w Krakowie i dobierze Ci jedną osobę.</p>')+'</div>'+

/* ----- Propozycja ----- */
function partsBars(p){
  return '<div class="bars">'+[['Zainteresowania',p.i],['Styl życia',p.v],['Jedzenie',p.c],['Wspólny czas',p.a]].map(([l,v])=>'<span>'+l+'</span><span class="bar"><i style="width:'+Math.round(v*100)+'%"></i></span><span class="num small">'+Math.round(v*100)+'%</span>').join('')+'</div>';
}

  if(!S.me){location.hash='#dolacz';return ''}

    '<p class="hint">Zdjęcia odsłonimy obojgu, gdy oboje powiecie „wchodzę”. Masz czas do '+fmtDay(new Date(m.expires).toISOString()).toLowerCase()+', '+fmtTime(new Date(m.expires).toISOString())+'.</p>'+
    '<div class="row"><button class="btn" style="flex:1" data-act="accept">Wchodzę</button><button class="btn line" style="flex:1" data-act="pass">Nie tym razem</button></div>'+
    '<button class="link quiet small" data-act="report" style="align-self:flex-start">'+(S._confirmRep?'Kliknij ponownie, żeby zgłosić i zablokować':'Zgłoś lub zablokuj')+'</button></div>';
  if(m.partner!=='tak') return '<div class="col fade">'+head+'<div class="stack"><h3>Czekamy na odpowiedź '+esc(p.name)+'</h3><p class="muted">Gdy '+esc(p.name)+' też powie „wchodzę”, damy Ci znać i zaplanujemy spotkanie.</p></div></div>';

    '<p class="small muted">Jeśli '+esc(p.name)+' nie przyjdzie, kolejną rezerwację masz bez prowizji. Jeśli Ty nie przyjdziesz, prowizja nie wraca i tracisz punkty wiarygodności.</p>'+

/* ----- Randka ----- */
VIEWS.randka=()=>{
  if(!S.me){location.hash='#dolacz';return ''}
  const m=S.match;if(!m||!m.paid){location.hash=homeHash();return ''}
  const p=byId(m.partnerId);
  if(!m.res){m.res=pickReservation(S.me,p,Date.now(),{...(S.lastDrop.load||{})});if(m.res)m.res.code=makeCode('me'+p.id+Date.now());save()}
  if(!m.res) return '<div class="col"><h2>Brak wolnych stolików</h2><p class="muted">W Waszych wspólnych oknach wszystkie lokale są zajęte. Zwracamy opłatę i szukamy dalej.</p></div>';
  const v=venue(m.res.venueId);
  const shared=v.cuisines.find(c=>[S.me,p].some(u=>u.like.includes(c)||u.tryC.includes(c)));
  return '<div class="col fade"><div class="person">'+avatar(p,false)+'<div><p class="muted">Randka z</p><h2>'+esc(p.name)+', '+p.age+'</h2></div></div>'+
    '<div class="stack" style="gap:6px"><h3 style="font-size:1.45rem">'+fmtDay(m.res.date)+', '+fmtTime(m.res.date)+'</h3><p class="muted">'+esc(v.name)+', '+esc(v.addr)+'</p>'+(m.checkin?'<p class="status ok">Lokal potwierdził, że jesteście na miejscu</p>':'')+'</div>'+
    (VENUE_PHOTOS[v.id]?'<img class="venue-photo" src="'+VENUE_PHOTOS[v.id]+'" alt="'+esc(v.name)+'">':'')+'<dl class="details"><dt>Lokal</dt><dd>'+esc(v.name)+' ('+esc(v.kind)+')</dd><dt>Dla Was</dt><dd>'+esc(v.offer)+'</dd>'+(shared?'<dt>Dlaczego tu</dt><dd>Kuchnia '+esc(shared)+', pasuje do Waszych wyborów</dd>':'')+'</dl>'+
    '<div class="codebox"><div><p class="small muted">Pokaż obsłudze przy stoliku</p><p class="code">'+m.res.code+'</p></div><a class="btn line sm" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v.addr+', Kraków')+'" target="_blank" rel="noopener">Mapa</a></div>'+
    '<div class="row">'+(m.changed?'':'<button class="btn line sm" data-act="reschedule">Zmień termin</button>')+'<button class="btn line sm" data-act="share">Wyślij szczegóły znajomemu</button></div>'+
    '<div class="stack"><h3>Bezpieczeństwo</h3><p class="muted small">Spotykacie się w lokalu partnerskim, w miejscu publicznym. Daj komuś bliskiemu znać, gdzie będziesz. W nagłej sytuacji dzwoń pod 112.</p>'+
    '<button class="link quiet small" data-act="report" style="align-self:flex-start">'+(S._confirmRep?'Kliknij ponownie, żeby zgłosić i zablokować':'Zgłoś problem')+'</button></div>'+
    '<hr><a class="btn block" href="#opinia">Po randce: jak było?</a></div>';
};

/* ----- Opinia ----- */

    '<div class="stack"><span class="q">Spotkaliście się?</span><div class="chips">'+opt('held','tak','Tak')+opt('held','partner',esc(p.name)+' nie '+verb(p,'przyszedł','przyszła','przyszło'))+opt('held','ja','Nie dałem/am rady')+'</div></div>'+
    (f.held==='tak'?'<div class="stack"><span class="q">Jak oceniasz spotkanie?</span><div class="scale">'+[1,2,3,4,5].map(n=>opt('rating',n,String(n))).join('')+'</div></div>'+

    '<label class="f" for="f-note">Coś jeszcze? (opcjonalnie)<textarea id="f-note" data-fb="note">'+esc(f.note)+'</textarea></label>'+
    '<p class="hint">Twoja ocena pomaga nam lepiej dobierać kolejne osoby. '+esc(p.name)+' jej nie zobaczy.</p><p class="err" id="fb-err" aria-live="polite"></p>'+

};

/* ----- Panel lokalu ----- */

    '<div class="stack"><h3>Rezerwacje</h3>'+(here.length?'<div class="tbl-wrap"><table><thead><tr><th>Termin</th><th>Goście</th><th>Rodzaj</th><th>Status</th></tr></thead><tbody>'+
      here.map(r=>'<tr><td>'+fmtDate(r.date)+'</td><td>'+esc(r.names)+'</td><td>'+BUDGETS.find(b=>b.id===r.type).l+'</td><td>'+(isC(r)?'<span class="status ok">Przyszli</span>':'<span class="status">Oczekuje</span>')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">W tym tygodniu nie ma jeszcze rezerwacji w tym lokalu.</p>')+

};

/* ----- Panel zespołu ----- */
function avgFee(d){const r=(d.reservations||[]);return r.length?r.reduce((a,x)=>a+feeFor(x.type),0)/r.length:feeFor('deser')}
function metrics(){
  const d=S.lastDrop,sim=d.sim,users=usersNow();let acc=sim.accepted,held=sim.held;
  const m=S.match;if(m&&m.my==='tak'&&m.partner==='tak'){acc++;if(m.checkin)held++}
  const P=d.stats.pairs;
  return {registered:users.length,verified:users.filter(u=>u.verified).length,eligible:d.stats.eligible,pairs:P,avg:d.stats.avg,accRate:P?acc/P:0,heldRate:acc?held/acc:0,noshowRate:acc?sim.noshow/acc:0,
    rating:sim.ratings.length?sim.ratings.reduce((a,b)=>a+b,0)/sim.ratings.length:0,acc,held,fee:avgFee(d),rev:Math.round(acc*2*avgFee(d))};
}
VIEWS.admin=()=>{
  const c=S.config,d=S.lastDrop,k=metrics(),users=usersNow(),pct=x=>Math.round(x*100)+'%';
  const g={K:0,M:0,N:0};users.forEach(u=>g[u.gender]++);const tot=users.length;
  const buckets=[55,60,65,70,75,80,85,90,95],counts=buckets.map(b=>d.pairs.filter(p=>p.score>=b&&p.score<b+5).length),maxc=Math.max(1,...counts);
  const nm=id=>{const u=byId(id);return u?esc(u.name)+(id==='me'?' (Ty)':'')+', '+u.age:'?'};
  return '<div class="wide fade"><div class="row" style="justify-content:space-between;align-items:flex-end;gap:16px"><div class="stack" style="gap:4px"><p class="muted">Panel zespołu · Kraków</p><h2>Wyniki ostatniego losowania</h2>'+
    '<p class="muted small">'+new Date(d.at).toLocaleString('pl-PL')+'. Akceptacje i obecność pozostałych par są symulowane na 120 kontach testowych (60 osób 19–26 lat i 60 osób 28–45 lat).</p></div>'+
    '<div class="row"><button class="btn line sm" data-act="demo">Demo dla jury</button><button class="btn sm" data-act="adminDrop">Uruchom losowanie</button></div></div>'+
    '<div class="kpis">'+[['Zapisani',k.registered],['Zweryfikowani',k.verified],['W losowaniu',k.eligible],['Pary',k.pairs],['Średnie dopasowanie',Math.round(k.avg)+'%'],
      ['Akceptacja',pct(k.accRate)],['Randki odbyte',pct(k.heldRate)],['No-show',pct(k.noshowRate)],['Średnia ocena',k.rating?k.rating.toFixed(1).replace('.',',')+' / 5':'–'],['Przychód',zl(k.rev)]]
      .map(([l,v])=>'<div class="kpi"><span>'+l+'</span><b>'+v+'</b></div>').join('')+'</div>'+
    '<div class="two"><div class="panel"><h3>Rozkład wyników par</h3><div class="hist">'+counts.map(n=>'<div><small>'+n+'</small><i style="height:'+(n/maxc*85)+'%"></i></div>').join('')+'</div><div class="hist-x">'+buckets.map(b=>'<span>'+b+'</span>').join('')+'</div>'+
      '<p class="muted small">Próg w cotygodniowym losowaniu: '+c.threshold+'. Możliwych par po filtrach: '+d.edges+'. Bez pary: '+d.unmatched.length+' os., mają pierwszeństwo w kolejnym losowaniu.</p></div>'+
    '<div class="panel"><h3>Proporcje płci</h3><div class="ratio"><i style="width:'+(g.K/tot*100)+'%;background:var(--accent)"></i><i style="width:'+(g.M/tot*100)+'%;background:var(--ink)"></i><i style="width:'+(g.N/tot*100)+'%;background:#A9A9B2"></i></div>'+
      '<dl class="details"><dt><span class="dot" style="background:var(--accent)"></span>Kobiety</dt><dd class="num">'+g.K+' ('+Math.round(g.K/tot*100)+'%)</dd><dt><span class="dot" style="background:var(--ink)"></span>Mężczyźni</dt><dd class="num">'+g.M+' ('+Math.round(g.M/tot*100)+'%)</dd><dt><span class="dot" style="background:#A9A9B2"></span>Osoby niebinarne</dt><dd class="num">'+g.N+' ('+Math.round(g.N/tot*100)+'%)</dd></dl>'+
      '<hr><h3>Przychód z losowania</h3><dl class="details"><dt>Prowizja</dt><dd class="num">'+c.commission+'% szacowanego rachunku</dd><dt>Śr. prowizja od osoby</dt><dd class="num">'+zl(Math.round(k.fee*100)/100)+'</dd><dt>Razem</dt><dd class="num">'+k.acc+' par × 2 × '+zl(Math.round(k.fee*100)/100)+' = '+zl(k.rev)+'</dd></dl></div></div>'+
    '<div class="stack"><div class="row" style="justify-content:space-between"><h3>Pary</h3><button class="btn line sm" data-act="csv">Kopiuj CSV</button></div><div class="tbl-wrap"><table><thead><tr><th>Osoba</th><th>Osoba</th><th class="n">Wynik</th><th class="n">Zainteresowania</th><th class="n">Styl życia</th><th class="n">Jedzenie</th><th class="n">Czas</th></tr></thead><tbody>'+
      d.pairs.slice().sort((a,b)=>b.score-a.score).slice(0,12).map(p=>'<tr><td>'+nm(p.a)+'</td><td>'+nm(p.b)+'</td><td class="n"><b>'+p.score+'</b></td><td class="n">'+pct(p.parts.i)+'</td><td class="n">'+pct(p.parts.v)+'</td><td class="n">'+pct(p.parts.c)+'</td><td class="n">'+pct(p.parts.a)+'</td></tr>').join('')+
      '</tbody></table></div><textarea id="csv-out" hidden readonly aria-label="CSV"></textarea></div>'+
    '<form class="panel" id="cfg" novalidate><h3>Ustawienia</h3><div class="grid4">'+
      [['w-i','Waga: zainteresowania',c.weights.i],['w-v','Waga: styl życia',c.weights.v],['w-c','Waga: jedzenie',c.weights.c],['w-a','Waga: wspólny czas',c.weights.a],
       ['c-thr','Próg dopasowania',c.threshold],['c-com','Prowizja (% rachunku)',c.commission]]
      .map(([id,l,v])=>'<label class="f" for="'+id+'">'+l+'<input id="'+id+'" type="number" min="0" max="100" value="'+v+'"></label>').join('')+
      '<label class="f" for="c-day">Dzień losowania<select id="c-day">'+DAY_NAMES.map((x,i)=>'<option value="'+i+'" '+(i===c.dropDay?'selected':'')+'>'+x+'</option>').join('')+'</select></label>'+
      '<label class="f" for="c-hour">Godzina<input id="c-hour" type="number" min="0" max="23" value="'+c.dropHour+'"></label></div>'+
      
      '<div class="row"><button class="btn" type="submit">Zapisz i przelicz</button><button type="button" class="btn line" data-act="reset">'+(S._confirmReset?'Na pewno? Kliknij ponownie':'Wyczyść dane')+'</button></div></form></div>';
};

/* ============ ROUTER ============ */
const ROUTES=['start','dolacz','czekam','match','randka','opinia','konto','lokal','admin'];
function route(){
  const r=(location.hash||'#start').slice(1),name=ROUTES.includes(r)?r:'start';
  const html=VIEWS[name]();
  if(html!=='') $('#app').innerHTML=html;
  $('#logo').href=S.me?homeHash():'#start';
  $('#topright').innerHTML=S.me?'<a href="'+homeHash()+'">'+(S.match?'Moja randka':'Propozycje')+'</a><a href="#konto">Konto</a>':(name==='dolacz'?'':'<a class="btn sm" href="#dolacz">Zacznij</a>');
}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});

/* ============ AKCJE ============ */
const D=()=>S.onb.draft;
function toggle(arr,v,max){const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else if(!max||arr.length<max)arr.push(v);return arr}
const rerender=()=>{const y=window.scrollY;route();window.scrollTo(0,y)};
function demoProfile(){
  const b=new Date();b.setFullYear(b.getFullYear()-21);b.setMonth(2,14);const bs=b.toISOString().slice(0,10);
  return {id:'me',name:'Ola',birth:bs,age:ageFrom(bs),gender:'K',seeking:['M'],ageMin:20,ageMax:26,uni:'UJ',email:'ola.nowak@student.uj.edu.pl',city:'Kraków',
    interests:['Indie','Tatry','Koncerty','Książki','Fotografia','Języki obce','Planszówki','Kawa specialty','Psychologia'],top:['Indie','Tatry','Języki obce'],
    values:[2,4,3,4,3],special:{},like:['włoska','gruzińska','japońska'],tryC:['koreańska','wietnamska'],budget:'kolacja',veg:false,
    slots:['2-2','3-2','4-2','5-1','5-2','6-1','1-2'],photo:null,verified:true,active:true,paused:false,reliability:100,noShows:0,freeDate:false,shift:{},consent:{reg:true,art9:false}};
}
const ACT={
  demo(){S=freshState(S.config);S.me=demoProfile();S.onb.draft=Object.assign(defaultDraft(),S.me);matchNow();doDrop();
    location.hash=homeHash();route();window.scrollTo(0,0)},
  findNow(el){el.disabled=true;el.textContent='Szukamy…';setTimeout(()=>{if(matchNow()){location.hash='#match'}else rerender()},900)},
  back(){S.onb.step=Math.max(0,S.onb.step-1);save();route();window.scrollTo(0,0)},
  cancelEdit(){S.onb.editing=false;S.onb.step=0;save();location.hash='#konto'},
  gender(el){D().gender=el.dataset.v;save();rerender()},
  seek(el){toggle(D().seeking,el.dataset.v);save();rerender()},
  interest(el){const d=D();toggle(d.interests,el.dataset.v,15);d.top=d.top.filter(x=>d.interests.includes(x));save();rerender()},
  top(el){toggle(D().top,el.dataset.v,3);save();rerender()},
  val(el){D().values[+el.dataset.k]=+el.dataset.v;save();rerender()},
  special(el){const [k,v]=el.dataset.v.split('|');if(v)D().special[k]=v;else delete D().special[k];save();rerender()},
  like(el){const d=D();toggle(d.like,el.dataset.v);d.tryC=d.tryC.filter(x=>!d.like.includes(x));save();rerender()},
  tryc(el){const d=D();toggle(d.tryC,el.dataset.v);d.like=d.like.filter(x=>!d.tryC.includes(x));save();rerender()},
  budget(el){D().budget=el.dataset.v;save();rerender()},
  slot(el){toggle(D().slots,el.dataset.v);save();rerender()},
  autoVerify(){const d=D();d.selfie=true;d.leg=true;save();submitStep()},
  leaveWaitlist(){S.waitlist=false;doDrop();location.hash=homeHash();route()},
  adminDrop(){doDrop();rerender();toast('Gotowe: '+S.lastDrop.stats.pairs+' par.')},
  accept(){S.match.my='tak';save();rerender();setTimeout(()=>{if(S.match&&S.match.my==='tak'){S.match.partner='tak';save();if(location.hash==='#match')rerender();toast(byId(S.match.partnerId).name+' też chce się spotkać')}},1800)},
  pass(){const m=S.match,p=byId(m.partnerId);S.prior.push(['me',p.id].sort().join('|'));S.history.push({at:Date.now(),name:p.name,outcome:'Nie tym razem'});S.match=null;S.lastOutcome='W porządku. Kliknij, żeby dostać kolejną propozycję.';save();location.hash='#czekam'},
  pay(){const m=S.match;
    if(!S.me.freeDate){const code=(($('#f-blik')||{}).value||'').replace(/\s/g,'');
      if(!/^\d{6}$/.test(code)){$('#pay-err').textContent='Kod BLIK ma 6 cyfr.';return}
      if(code==='000000'){$('#pay-err').textContent='Bank odrzucił płatność. Wygeneruj nowy kod i spróbuj jeszcze raz.';return}
      const fee=feeFor(dateType(S.me,byId(m.partnerId)));S.ledger.push({at:Date.now(),who:'me',desc:'Prowizja '+S.config.commission+'%, BLIK',amount:fee});S.ledger.push({at:Date.now(),who:'partner',desc:'Prowizja, druga osoba',amount:fee});
    } else {S.me.freeDate=false;S.ledger.push({at:Date.now(),who:'me',desc:'Rezerwacja bez prowizji',amount:0})}
    m.paid=true;save();location.hash='#randka'},
  reschedule(){const m=S.match,p=byId(m.partnerId);const r=pickReservation(S.me,p,Date.now(),{...(S.lastDrop.load||{})},m.res.slot);
    if(r){r.code=m.res.code;m.res=r;m.changed=true;save();rerender();toast('Nowy termin: '+fmtDate(r.date))}else toast('Nie macie innego wspólnego terminu w tym tygodniu.')},
  share(){const m=S.match,v=venue(m.res.venueId),p=byId(m.partnerId);
    const txt='Idę na randkę: '+fmtDate(m.res.date)+', '+v.name+', '+v.addr+', Kraków. Osoba: '+p.name+', '+p.age+'.';
    try{navigator.clipboard.writeText(txt).then(()=>toast('Skopiowano. Wklej to komuś zaufanemu.'),()=>toast(txt))}catch(e){toast(txt)}},
  report(){const m=S.match;if(!m)return;
    if(!S._confirmRep){S._confirmRep=true;rerender();setTimeout(()=>{S._confirmRep=false;if(['#match','#randka'].includes(location.hash))rerender()},5000);return}
    S._confirmRep=false;const p=byId(m.partnerId);S.blocked.push(p.id);S.prior.push(['me',p.id].sort().join('|'));S.history.push({at:Date.now(),name:p.name,outcome:'Zgłoszono'});
    S.match=null;S.lastOutcome='Dziękujemy za zgłoszenie. Ta osoba nie zostanie Ci już zaproponowana, a nasz zespół sprawdzi sprawę.';save();location.hash='#czekam'},
  toDate(){location.hash='#randka'},
  how(){const el=document.getElementById('jak');if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})},
  fb(el){const k=el.dataset.k;S.fb[k]=k==='rating'?+el.dataset.v:el.dataset.v;rerender()},
  edit(){S.onb={step:0,draft:Object.assign(defaultDraft(),S.me,{consent:S.me.consent||{reg:true,art9:false},selfie:true,leg:true}),editing:true};save();location.hash='#dolacz'},
  pause(){S.me.paused=!S.me.paused;save();rerender()},
  delete(){if(!S._confirmDel){S._confirmDel=true;rerender();return}S=freshState(S.config);doDrop();location.hash='#start';toast('Konto i dane zostały usunięte.')},
  reset(){if(!S._confirmReset){S._confirmReset=true;rerender();return}S=freshState();doDrop();rerender();toast('Wyczyszczono dane.')},
  csv(){const d=S.lastDrop;const txt=[['osoba_a','osoba_b','wynik','zainteresowania','styl_zycia','jedzenie','czas']].concat(d.pairs.map(p=>[byId(p.a).name,byId(p.b).name,p.score,p.parts.i.toFixed(2),p.parts.v.toFixed(2),p.parts.c.toFixed(2),p.parts.a.toFixed(2)])).map(r=>r.join(',')).join('\n');
    const ta=$('#csv-out'),fb=()=>{ta.hidden=false;ta.value=txt;ta.select();toast('Zaznaczono CSV, skopiuj ręcznie.')};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Skopiowano CSV.'),fb)}catch(e){fb()}}
};
function submitStep(){
  const i=S.onb.step,d=D(),err=stepError(i,d),last=STEPS.length-1;
  if(err){$('#onb-err').textContent=err;return}
  if(i===last){const editing=S.onb.editing;finishOnboarding();
    if(editing){location.hash='#konto';toast('Zapisano.');return}
    matchNow();location.hash=homeHash();return}
  S.onb.step=i+1;save();route();window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.bind){const path=el.dataset.bind.split('.');let o=D();for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=el.type==='checkbox'?el.checked:el.dataset.num?+el.value:el.value;save()}
  if(el.dataset.fb)S.fb[el.dataset.fb]=el.value});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.bind==='consent.art9')rerender();
  if(el.dataset.change==='venue'){S.venueSel=el.value;save();rerender()}
  if(el.dataset.file){const file=el.files&&el.files[0];if(!file)return;const k=el.dataset.file;
    if(k!=='photo'){D()[k]=true;save();rerender();return}
    const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=240;c.width=s;c.height=s;const m=Math.min(img.width,img.height);
      c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);D().photo=c.toDataURL('image/jpeg',0.82);save();rerender()};img.src=rd.result};rd.readAsDataURL(file)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='onb')submitStep();
  if(f.id==='fbform'){const fb=S.fb,m=S.match,p=byId(m.partnerId),me=S.me;
    if(!fb.held){$('#fb-err').textContent='Zaznacz, czy się spotkaliście.';return}
    if(fb.held==='tak'&&(!fb.rating||!fb.again)){$('#fb-err').textContent='Dodaj ocenę i zaznacz, czy chcesz się zobaczyć ponownie.';return}
    let out='';
    if(fb.held==='tak'){
      if(!m.checkin){m.checkin=true}
      if(fb.rating>=4){const best=Object.entries(m.parts).sort((a,b)=>b[1]-a[1])[0][0];me.shift[best]=(me.shift[best]||0)+4}
      out=fb.again==='tak'&&(m.score>=58||fb.rating>=4)?p.name+' też chce się zobaczyć ponownie. Instagram: @'+p.insta:'Dzięki. Weźmiemy to pod uwagę przy kolejnej propozycji.';
      S.history.push({at:Date.now(),name:p.name,outcome:'Spotkanie, ocena '+fb.rating+'/5'});
    } else if(fb.held==='partner'){me.freeDate=true;out='Przykro nam. Następną rezerwację masz bez prowizji.';S.history.push({at:Date.now(),name:p.name,outcome:'Druga osoba nie przyszła'})}
    else {me.noShows=(me.noShows||0)+1;me.reliability=Math.max(0,me.reliability-30);if(me.noShows>=2)me.paused=true;
      out=me.noShows>=2?'To druga nieobecność, więc wstrzymujemy konto na 30 dni.':'Tracisz punkty wiarygodności, a prowizja za tę randkę nie wraca. Następnym razem daj znać wcześniej, to przełożymy termin.';
      S.history.push({at:Date.now(),name:p.name,outcome:'Nieobecność'})}
    S.prior.push(['me',p.id].sort().join('|'));S.match=null;S.fb=null;S.lastOutcome=out;save();location.hash='#czekam'}
  if(f.id==='checkin'){const code=($('#f-code').value||'').trim().toUpperCase(),vid=S.venueSel||(S.match&&S.match.res&&S.match.res.venueId)||'v2',m=S.match;
    if(m&&m.res&&m.res.code===code){if(m.res.venueId!==vid){$('#ci-err').textContent='Ten kod dotyczy rezerwacji w innym lokalu.';return}
      if(m.checkin){$('#ci-err').textContent='Ta para jest już potwierdzona.';return}
      m.checkin=true;save();rerender();toast('Potwierdzono. Miłego wieczoru!');return}
    const r=S.lastDrop.reservations.find(x=>x.code===code&&x.venueId===vid);
    if(r){if(S.checked[code]){$('#ci-err').textContent='Ta para jest już potwierdzona.';return}S.checked[code]=true;save();rerender();toast('Potwierdzono.');return}
    $('#ci-err').textContent='Nie ma takiego kodu w tym lokalu. Sprawdź, czy wpisano go dokładnie, np. 2M-K7QM.'}
  if(f.id==='cfg'){const n=id=>Math.max(0,+$(id).value||0),c=S.config;
    c.weights={i:n('#w-i'),v:n('#w-v'),c:n('#w-c'),a:n('#w-a')};c.threshold=Math.min(100,n('#c-thr'));c.commission=Math.min(50,n('#c-com'));
    c.dropDay=+$('#c-day').value;c.dropHour=Math.min(23,n('#c-hour'));
    doDrop();rerender();toast('Zapisano i przeliczono.')}
});
/* Link z kodu QR (…/?demo lub …/#demo) od razu uruchamia świeże demo z profilem Oli. */
(function(){const q=new URLSearchParams(location.search);
  if(q.has('demo')||location.hash==='#demo'){try{history.replaceState(null,'',location.pathname)}catch(e){}ACT.demo();return}
  route()})();

/* Tło: dwa bardzo miękkie bordowe poblaski i kilka cienkich smug światła, które powoli suną po skosie i gasną na końcach. */
(function(){
  const cv=document.getElementById('waves');if(!cv||!cv.getContext)return;
  const ctx=cv.getContext('2d'),rgb=getComputedStyle(document.documentElement).getPropertyValue('--wave').trim()||'122,21,48';
  const still=matchMedia('(prefers-reduced-motion: reduce)');
  const ANG=-0.32, DX=Math.cos(ANG), DY=Math.sin(ANG);
  let W=0,H=0,raf=0,last=0,streaks=[],seed=7;
  const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  function spawn(age){
    const life=16000+rnd()*12000;
    return {x:rnd()*W*1.2-W*0.1,y:rnd()*H*1.3-H*0.15,len:(0.28+rnd()*0.32)*Math.max(W,700),speed:0.008+rnd()*0.012,peak:0.10+rnd()*0.10,life,age:age==null?0:age*life,w:rnd()<0.3?1.4:0.8};
  }
  function size(){const dpr=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=W<600?5:8;streaks=Array.from({length:n},()=>spawn(rnd()))}
  function glow(x,y,r,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba('+rgb+','+a+')');g.addColorStop(1,'rgba('+rgb+',0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
  function draw(t,dt){
    ctx.clearRect(0,0,W,H);
    const R=Math.max(W,H)*0.55;
    glow(W*(0.88+0.04*Math.sin(t/23000)),H*(0.08+0.05*Math.cos(t/29000)),R,0.075);
    glow(W*(0.06+0.05*Math.cos(t/31000)),H*(0.92+0.04*Math.sin(t/27000)),R*0.9,0.055);
    for(let i=0;i<streaks.length;i++){
      const s=streaks[i];s.age+=dt;
      if(s.age>s.life){streaks[i]=spawn(0);continue}
      const p=s.age/s.life, env=Math.sin(Math.PI*p);
      const ox=s.x+DX*s.speed*s.age, oy=s.y+DY*s.speed*s.age;
      const x2=ox+DX*s.len, y2=oy+DY*s.len;
      const g=ctx.createLinearGradient(ox,oy,x2,y2);
      g.addColorStop(0,'rgba('+rgb+',0)');g.addColorStop(0.5,'rgba('+rgb+','+(s.peak*env).toFixed(3)+')');g.addColorStop(1,'rgba('+rgb+',0)');
      ctx.strokeStyle=g;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(x2,y2);ctx.stroke();
    }
  }
  function loop(t){const dt=last?Math.min(64,t-last):16;last=t;draw(t,dt);raf=requestAnimationFrame(loop)}
  function start(){cancelAnimationFrame(raf);last=0;if(still.matches||document.hidden)draw(0,0);else raf=requestAnimationFrame(loop)}
  size();start();
  window.addEventListener('resize',()=>{size();if(still.matches)draw(0,0)});
  document.addEventListener('visibilitychange',start);
  if(still.addEventListener)still.addEventListener('change',start);
})();
</script>
